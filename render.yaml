# Render Blueprint Specification for CampusCare (Internal File-Based Database)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: campuscare
    runtime: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm run start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_REGISTER_KEY
        value: "CampusCare2026AdminKey"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: NEXT_PUBLIC_TURNSTILE_SITE_KEY
        value: "0x4AAAAAAFEikFbvGEYrhhB-"
      - key: TURNSTILE_SECRET_KEY
        value: "0x4AAAAAAFEikJH4W1uMwP0F2ZwG2cXDxNU"
