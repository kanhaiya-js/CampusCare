# Render Blueprint Specification for CampusCare
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: campuscare
    runtime: node
    plan: free
    buildCommand: npm install && npm run render-build
    startCommand: npm run start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_REGISTER_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local

databases:
  - name: campuscare-db
    plan: free
    databaseName: campuscare
    user: campuscare
